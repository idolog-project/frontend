# Rendered by the nginx image's entrypoint into /etc/nginx/conf.d/default.conf,
# with ${PORT} substituted from the environment. Only names that exist as
# environment variables are substituted, so nginx's own $uri survives untouched.

server {
    listen      ${PORT};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Asset filenames carry a content hash, so a given name can never change
    # meaning and is safe to cache for a year. Missing ones must 404 rather than
    # fall through to the SPA, or a stale deploy would serve HTML where the
    # browser expects JavaScript.
    location /assets/ {
        try_files $uri =404;
        expires   1y;
        add_header Cache-Control "public, immutable";
    }

    # The app owns its routes. Anything that is not a file on disk is handed to
    # index.html, so reloading on /locations/1 renders the app instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The one file that must never be cached: it is what points at the current
    # asset hashes, so a cached copy pins the browser to the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The app calls its API at the same origin under /api (see src/api/client.ts),
    # and MSW only answers in development — so a production container needs this
    # proxy, or every request 404s against the static files. Uncomment and set
    # the backend origin once it is deployed; left off so the container still
    # starts while the backend is not up.
    #
    # location /api/ {
    #     proxy_pass         https://backend-host/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $proxy_host;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
