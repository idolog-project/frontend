<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Paints the phone browser's own chrome to match the page. Without it the
      address bar stays light above a near-black app, which reads as a rendering
      fault rather than a theme. Matches `--color-background` in tokens.css.
    -->
    <meta name="theme-color" content="#0b0b0f" />

    <!--
      Hanken Grotesk / Plus Jakarta Sans are the faces named by the Stitch design
      system, but neither supports Hangul. Pretendard is listed after them in the
      font stack so Latin glyphs come from the grotesque and Hangul falls through
      to Pretendard, per glyph.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <title>Idolog — 최애의 뮤직비디오 속으로</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
