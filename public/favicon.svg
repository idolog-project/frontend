<!--
  The viewfinder frame the app already uses as its one recurring flourish
  (see `ViewfinderFrame` in src/components/ui/media.tsx), closed around a
  subject, in the signature coral-to-violet gradient.

  What it replaces was Vite's own bolt, left over from scaffolding — a logo for
  the build tool, not the product.

  Drawn heavy and simple because a favicon is read at 16px: four corner
  brackets and a filled centre survive that, fine detail does not.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="idolog" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A6E" />
      <stop offset="1" stop-color="#8A5CF6" />
    </linearGradient>
  </defs>

  <g
    fill="none"
    stroke="url(#idolog)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 11.5V6.5A2.5 2.5 0 0 1 6.5 4h5" />
    <path d="M20.5 4h5A2.5 2.5 0 0 1 28 6.5v5" />
    <path d="M28 20.5v5a2.5 2.5 0 0 1-2.5 2.5h-5" />
    <path d="M11.5 28h-5A2.5 2.5 0 0 1 4 25.5v-5" />
  </g>

  <circle cx="16" cy="16" r="4.75" fill="url(#idolog)" />
</svg>
